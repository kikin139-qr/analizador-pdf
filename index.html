<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analizador Masivo de PDFs Clínicos</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 30px; color: #333; }
        .card { max-width: 650px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { margin-top: 0; color: #0056b3; text-align: center; }
        .drop-zone { border: 2px dashed #0056b3; border-radius: 8px; padding: 40px; text-align: center; background: #eef5ff; cursor: pointer; transition: 0.3s; margin-top: 20px; }
        .drop-zone:hover { background: #d0e3ff; }
        .status { margin-top: 20px; font-weight: bold; text-align: center; color: #555; }
        .result-box { display: none; margin-top: 25px; padding: 15px; background: #e8f5e9; border: 1px solid #c8e6c9; border-radius: 6px; }
        textarea { width: 100%; height: 80px; margin-top: 10px; font-weight: bold; font-size: 14px; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; padding: 12px; background: #28a745; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        button:hover { background: #218838; }
    </style>
</head>
<body>

<div class="card">
    <h2>🏥 Analizador de PDFs Clínicos</h2>
    <p style="text-align:center; font-size: 14px; color: #666;">Filtra páginas duplicadas por criterios clínicos (OA, Fecha, Historia, Análisis) y genera el rango de impresión.</p>
    
    <div class="drop-zone" id="dropZone">
        📂 <b>Arrastra aquí tu PDF de 400 a 600 hojas</b><br><small>o haz clic para seleccionar</small>
        <input type="file" id="fileInput" accept="application/pdf" style="display:none;">
    </div>

    <div class="status" id="statusText"></div>

    <div class="result-box" id="resultBox">
        <div id="summaryText"></div>
        <label for="rangoOutput"><b>Rango para la Impresora:</b></label>
        <textarea id="rangoOutput" readonly></textarea>
        <button onclick="copiarRango()">📋 Copiar Rango al Portapapeles</button>
    </div>
</div>

<script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const statusText = document.getElementById('statusText');
    const resultBox = document.getElementById('resultBox');
    const rangoOutput = document.getElementById('rangoOutput');
    const summaryText = document.getElementById('summaryText');

    dropZone.addEventListener('click', () => fileInput.click());
    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.style.background = '#d0e3ff'; });
    dropZone.addEventListener('dragleave', () => dropZone.style.background = '#eef5ff');
    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.style.background = '#eef5ff';
        if (e.dataTransfer.files.length) procesarPDF(e.dataTransfer.files[0]);
    });
    fileInput.addEventListener('change', (e) => { if (e.target.files.length) procesarPDF(e.target.files[0]); });

    async function procesarPDF(file) {
        statusText.innerText = '⌛ Leyendo y analizando PDF...';
        resultBox.style.display = 'none';

        const arrayBuffer = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
        const totalPages = pdf.numPages;

        let vistas = new Set();
        let paginasBuenas = [];

        for (let i = 1; i <= totalPages; i++) {
            statusText.innerText = `⌛ Analizando página ${i} de ${totalPages}...`;
            const page = await pdf.getPage(i);
            const textContent = await page.getTextContent();
            const text = textContent.items.map(item => item.str).join(' ');

            const oaMatch = text.match(/(?:OA|Atención|Código)[\s\|:]*(\d+)/i);
            const oa = oaMatch ? oaMatch[1] : '';

            const fechaMatch = text.match(/(\d{2,4}[\/-]\d{1,2}[\/-]\d{2,4})/);
            const fecha = fechaMatch ? fechaMatch[1] : '';

            const hcMatch = text.match(/(?:Historia|HC)[\s\|:]*(\d+)/i);
            const hc = hcMatch ? hcMatch[1] : '';

            const analisisMatch = text.match(/(?:Análisis|BIOQUIMICA|HEMATOLOGIA|EXAMEN)(.*)/i);
            const analisis = analisisMatch ? analisisMatch[0].substring(0, 150) : text.substring(0, 150);

            let clave = (oa || fecha) ? `${oa}|${fecha}|${hc}|${analisis.trim()}` : text.trim();

            if (!vistas.has(clave) && text.trim().length > 10) {
                vistas.add(clave);
                paginasBuenas.push(i);
            }
        }

        if (paginasBuenas.length > 0) {
            let rangos = [];
            let inicio = paginasBuenas[0];
            let fin = paginasBuenas[0];

            for (let k = 1; k < paginasBuenas.length; k++) {
                if (paginasBuenas[k] === fin + 1) {
                    fin = paginasBuenas[k];
                } else {
                    rangos.push(inicio === fin ? `${inicio}` : `${inicio}-${fin}`);
                    inicio = paginasBuenas[k];
                    fin = paginasBuenas[k];
                }
            }
            rangos.push(inicio === fin ? `${inicio}` : `${inicio}-${fin}`);

            summaryText.innerHTML = `<p style="margin-top:0;"><b>Análisis Completado:</b><br>Hojas totales: ${totalPages}<br>Hojas únicas a imprimir: <b>${paginasBuenas.length}</b></p>`;
            rangoOutput.value = rangos.join(', ');
            resultBox.style.display = 'block';
            statusText.innerText = '✅ ¡Listo!';
        } else {
            statusText.innerText = '⚠️ No se encontraron páginas procesables.';
        }
    }

    function copiarRango() {
        rangoOutput.select();
        document.execCommand('copy');
        alert('¡Rango copiado al portapapeles!');
    }
</script>
</body>
</html>
